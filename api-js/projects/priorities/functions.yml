add-priority:
  handler: projects/priorities/add.add
  timeout: 5             # seconds
  memorySize: 256        # MB
  reservedConcurrency: 5
  events:
    - http:
        path: projects/{projectId}/prioritise
        method: post
        cors: true

remove-priority:
  handler: projects/priorities/remove.remove
  timeout: 5             # seconds
  memorySize: 256        # MB
  reservedConcurrency: 5
  events:
    - http:
        path: projects/{projectId}/deprioritise
        method: post
        cors: true

get-priorities:
  handler: projects/priorities/list.list
  timeout: 5             # seconds
  memorySize: 256        # MB
  reservedConcurrency: 5
  events:
    - http:
        path: priorities
        method: get
        cors: true
