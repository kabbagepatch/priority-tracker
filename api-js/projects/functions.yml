create-project:
  handler: projects/create.create
  timeout: 5             # seconds
  memorySize: 256        # MB
  reservedConcurrency: 5
  events:
    - http:
        path: projects
        method: post
        cors: true

get-projects:
  handler: projects/list.list
  timeout: 5             # seconds
  memorySize: 256        # MB
  reservedConcurrency: 5
  events:
    - http:
        path: projects
        method: get
        cors: true

get-category-projects:
  handler: projects/list.listCategory
  timeout: 5             # seconds
  memorySize: 256        # MB
  reservedConcurrency: 5
  events:
    - http:
        path: categories/{categoryId}/projects
        method: get
        cors: true

get-project:
  handler: projects/get.get
  timeout: 5             # seconds
  memorySize: 256        # MB
  reservedConcurrency: 5
  events:
    - http:
        path: projects/{projectId}
        method: get
        cors: true

update-project:
  handler: projects/update.update
  timeout: 5             # seconds
  memorySize: 256        # MB
  reservedConcurrency: 5
  events:
    - http:
        path: projects/{projectId}
        method: put
        cors: true

delete-project:
  handler: projects/delete.delete
  timeout: 5             # seconds
  memorySize: 256        # MB
  reservedConcurrency: 5
  events:
    - http:
        path: projects/{projectId}
        method: delete
        cors: true
