create-task:
  handler: tasks/create.create
  timeout: 5             # seconds
  memorySize: 256        # MB
  reservedConcurrency: 5
  events:
    - http:
        path: tasks
        method: post
        cors: true

get-tasks:
  handler: tasks/list.list
  timeout: 5             # seconds
  memorySize: 256        # MB
  reservedConcurrency: 5
  events:
    - http:
        path: tasks
        method: get
        cors: true

get-project-tasks:
  handler: tasks/list.listProject
  timeout: 5             # seconds
  memorySize: 256        # MB
  reservedConcurrency: 5
  events:
    - http:
        path: projects/{projectId}/tasks
        method: get
        cors: true

get-task:
  handler: tasks/get.get
  timeout: 5             # seconds
  memorySize: 256        # MB
  reservedConcurrency: 5
  events:
    - http:
        path: tasks/{id}
        method: get
        cors: true

update-task:
  handler: tasks/update.update
  timeout: 5             # seconds
  memorySize: 256        # MB
  reservedConcurrency: 5
  events:
    - http:
        path: tasks/{id}
        method: put
        cors: true

update-task-status:
  handler: tasks/update.updateStatus
  timeout: 5             # seconds
  memorySize: 256        # MB
  reservedConcurrency: 5
  events:
    - http:
        path: tasks/{id}/status
        method: put
        cors: true

delete-task:
  handler: tasks/delete.delete
  timeout: 5             # seconds
  memorySize: 256        # MB
  reservedConcurrency: 5
  events:
    - http:
        path: tasks/{id}
        method: delete
        cors: true
